<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="title desc">
  <title id="title">Dupster logo</title>
  <desc id="desc">A modern Dupster wordmark with overlapping duplicate files and a scan line.</desc>
  <defs>
    <linearGradient id="tile" x1="22" y1="26" x2="210" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.56" stop-color="#111827"/>
      <stop offset="1" stop-color="#06111a"/>
    </linearGradient>
    <linearGradient id="scan" x1="52" y1="70" x2="182" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="word" x1="268" y1="70" x2="740" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="240" rx="36" fill="#070a10"/>
  <g filter="url(#shadow)">
    <rect x="34" y="30" width="172" height="180" rx="34" fill="url(#tile)" stroke="#263244" stroke-width="2"/>
    <path d="M82 72h62l34 34v76H82z" fill="#0b1018" stroke="#38bdf8" stroke-width="7" stroke-linejoin="round"/>
    <path d="M144 72v36h34" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linejoin="round"/>
    <path d="M64 90h62l34 34v76H64z" fill="#101928" stroke="url(#scan)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M126 90v36h34" fill="none" stroke="#34d399" stroke-width="7" stroke-linejoin="round"/>
    <path d="M86 152h54" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/>
    <path d="M86 174h68" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M54 122h52" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M154 122h44" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  </g>

  <text x="256" y="126"
        fill="url(#word)"
        font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif"
        font-size="76"
        font-weight="800"
        letter-spacing="6">DUPSTER</text>
  <text x="261" y="164"
        fill="#7dd3fc"
        font-family="Inter, SF Pro Text, Segoe UI, Arial, sans-serif"
        font-size="22"
        font-weight="600"
        letter-spacing="3">FIND DUPLICATES. KEEP CONTROL.</text>
  <path d="M260 186h264" stroke="url(#scan)" stroke-width="8" stroke-linecap="round"/>
</svg>
