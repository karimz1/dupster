[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dupster-cli"
version = "0.0.7"
description = "Modern CLI to find and clean up duplicate files with an interactive TUI"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Karim Zouine", email = "karim.zouine@example.com"}
]
maintainers = [
    {name = "Karim Zouine"}
]
keywords = ["duplicate", "files", "tui", "cli", "deduplication", "cleanup", "finder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0,<14.0",
    "typer>=0.9.0,<1.0.0",
    "textual>=0.47.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "black>=23.0,<24.0",
    "ruff>=0.1.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/karimz1/dupster"
Repository = "https://github.com/karimz1/dupster"
Issues = "https://github.com/karimz1/dupster/issues"
Changelog = "https://github.com/karimz1/dupster/blob/main/CHANGELOG.md"

[project.scripts]
dupster = "dupster.ui.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dupster*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line too long (acceptable for CSS strings and UI messages)
    "E402",  # Module level import not at top (acceptable for conditional imports in tests)
    "B008",  # Do not perform function calls in argument defaults (Typer pattern)
]
fixable = ["ALL"]
unfixable = []

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
