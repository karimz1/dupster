name: Homebrew Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --extra dev --python 3.11

      - name: Run test suite
        run: uv run pytest -v

  create-github-release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Prepare release notes
        id: release_notes
        run: |
          TAG=${{ steps.get_version.outputs.tag }}
          VERSION=${{ steps.get_version.outputs.version }}
          NOTES_FILE=".github/releases/${TAG}.md"
          OUTPUT_FILE="release-notes.md"

          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" "$OUTPUT_FILE"
          else
            {
              echo "## Dupster ${TAG}"
              echo ""
              if [ -f CHANGELOG.md ]; then
                CHANGES=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '1d;$d')
                if [ -n "$CHANGES" ]; then
                  echo "$CHANGES"
                else
                  echo "See [CHANGELOG.md](CHANGELOG.md) for details."
                fi
              else
                echo "Release version ${VERSION}"
              fi
              echo ""
              echo "### Installation"
              echo ""
              echo "Homebrew is recommended because it fetches the official build from the Dupster tap."
              echo ""
              echo '```bash'
              echo "brew tap karimz1/dupster"
              echo "brew install karimz1/dupster/dupster-cli"
              echo '```'
              echo ""
              echo "From source:"
              echo ""
              echo '```bash'
              echo "pip install git+https://github.com/karimz1/dupster.git@${TAG}"
              echo '```'
            } > "$OUTPUT_FILE"
          fi

          if [ ! -s "$OUTPUT_FILE" ]; then
            {
              echo "## Dupster ${TAG}"
              echo ""
              echo "See [CHANGELOG.md](CHANGELOG.md) for details."
            } > "$OUTPUT_FILE"
            fi
          echo "path=$OUTPUT_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ steps.get_version.outputs.tag }}"
          body_path: ${{ steps.release_notes.outputs.path }}
          draft: false
          prerelease: ${{ steps.get_version.outputs.prerelease }}

  homebrew-formula:
    name: Update Homebrew Formula
    needs: [test, create-github-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dupster repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compute tarball SHA256
        id: sha
        run: |
          curl -L -o source.tar.gz https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.vars.outputs.tag }}.tar.gz
          SHA256=$(sha256sum source.tar.gz | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install homebrew-pypi-poet and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system homebrew-pypi-poet .

      - name: Generate Python resource blocks
        id: poet
        run: |
          : > resources.txt
          for pkg in rich typer textual; do
            poet --resources $pkg >> resources.txt
            echo "" >> resources.txt
          done
          echo "resources<<EOF" >> $GITHUB_OUTPUT
          cat resources.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Clone Homebrew tap repository
        uses: actions/checkout@v4
        with:
          repository: karimz1/homebrew-dupster
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Generate Homebrew Formula
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/dupster-cli.rb <<'RUBY'
          class DupsterCli < Formula
            include Language::Python::Virtualenv

            desc "Modern CLI to find and clean up duplicate files with an interactive TUI"
            homepage "https://github.com/${{ github.repository }}"
            url "https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.vars.outputs.tag }}.tar.gz"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            license "Apache-2.0"
            version "${{ steps.vars.outputs.version }}"

            depends_on "python@3.11"

          ${{ steps.poet.outputs.resources }}

            def install
              # Install Python dependencies in virtualenv
              virtualenv_install_with_resources

              # The package is now installed via pip (pyproject.toml)
              # Just ensure the binary is available
            end

            test do
              assert_match "Dupster", shell_output("#{bin}/dupster --help")
              assert_match version.to_s, shell_output("#{bin}/dupster --version")
            end
          end
          RUBY

      - name: Commit and push formula to tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dupster-cli.rb
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Dupster formula to ${{ steps.vars.outputs.tag }}"
            git push https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/karimz1/homebrew-dupster.git main
          fi
