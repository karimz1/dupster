name: Homebrew Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dupster repo
        uses: actions/checkout@v4

      - name: Get release tag
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Compute tarball SHA256
        id: sha
        run: |
          curl -L -o source.tar.gz https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.vars.outputs.tag }}.tar.gz
          echo "sha256=$(sha256sum source.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install poet and deps
        run: |
          python -m pip install --upgrade pip
          pip install homebrew-pypi-poet
          pip install -r requirements.txt

      - name: Generate resource blocks
        id: poet
        run: |
          pip install -r requirements.txt
          echo "" > resources.txt
          for pkg in $(cat requirements.txt | grep -v '^#'); do
            poet --resources $pkg >> resources.txt
            echo "" >> resources.txt
          done
          echo "resources<<EOF" >> $GITHUB_OUTPUT
          cat resources.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Clone Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: YOUR_GITHUB_USERNAME/homebrew-dupster
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}

      - name: Write Dupster Formula
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/dupster.rb <<'RUBY'
          class Dupster < Formula
            include Language::Python::Virtualenv

            desc "Modern CLI to find and clean up duplicate files"
            homepage "https://github.com/${{ github.repository }}"
            url "https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.vars.outputs.tag }}.tar.gz"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            license "Apache-2.0"

            depends_on "python@3.9"

          ${{ steps.poet.outputs.resources }}

            def install
              venv = virtualenv_create(libexec, "python3.9")
              venv.pip_install resources
              libexec.install "dupster.py"
              (bin/"dupster").write <<~EOS
                #!/bin/bash
                exec "#{libexec}/bin/python" "#{libexec}/dupster.py" "$@"
              EOS
            end

            test do
              assert_match "Usage", shell_output("#{bin}/dupster --help")
            end
          end
          RUBY

      - name: Commit and push to tap
        run: |
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Formula/dupster.rb
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Dupster to ${{ steps.vars.outputs.tag }}"
            git push
          fi